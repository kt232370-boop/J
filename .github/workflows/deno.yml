name: Build FanSite APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDK_BIN=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -x "$candidate" ]; then
              SDK_BIN="$candidate"
              break
            fi
          done

          if [ -n "$SDK_BIN" ]; then
            printf 'y\n%.0s' $(seq 1 50) | "$SDK_BIN" --licenses >/dev/null 2>&1 || true
            printf 'y\n%.0s' $(seq 1 20) | "$SDK_BIN" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            printf 'y\n%.0s' $(seq 1 20) | "$SDK_BIN" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --console=plain --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk FanSite-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanSite-debug-apk
          path: FanSite-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk FanSite-debug.apk --clobber
          else
            gh release create latest-apk FanSite-debug.apk --title "FanSite Latest APK" --notes "Automated debug APK build"
          fi
